<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokéChess — Kiểm tra nút co giãn</title><link rel="stylesheet" href="runtime/buttons.css"><style>body{margin:0;padding:24px;background:#111c30;color:#edf2fa;font:16px/1.5 system-ui}main{max-width:900px;margin:auto}section{border:1px solid #425673;padding:16px;margin:16px 0;display:flex;gap:18px;align-items:start;flex-wrap:wrap}h2{width:100%;font-size:18px;margin:0}p{max-width:70ch}.sample{max-width:100%}</style><main><h1>Bộ nút co giãn</h1><p>Hai ảnh nền không chữ. Các nhãn dưới đây là HTML động. Thử thu hẹp cửa sổ, Tab, Enter và phím Space.</p><section><h2>Nhiều độ rộng</h2><button data-pixel-button="primary" style="width:88px">Mua</button><button data-pixel-button="primary" style="width:160px">Trang bị</button><button data-pixel-button="danger" style="width:280px">Bắt đầu chiến đấu</button></section><section><h2>Ngôn ngữ và chữ dài</h2><button class="full" data-pixel-button="primary">Tự động sắp xếp đội hình và chuẩn bị trận chiến</button><button style="width:180px" data-pixel-button="danger">Begin the next battle</button><button style="width:180px" data-pixel-button="primary">开始战斗</button><button style="width:160px" data-pixel-button="primary">SehrLangerZusammengesetzterButtontext</button></section><section><h2>Trạng thái</h2><button data-pixel-button="primary">Hover / nhấn</button><button data-pixel-button="primary" disabled>Không đủ vàng</button><button data-pixel-button="danger" disabled>Chưa sẵn sàng</button><button data-pixel-button="primary" aria-label="Thêm vị trí">+</button></section><p id="feedback" role="status">Chưa bấm nút.</p></main><script src="runtime/buttons.js"></script><script>document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>document.querySelector('#feedback').textContent='Đã bấm: '+b.innerText));</script></html>
