"use strict";
/* ================= PIXEL TOOLCHAIN (native 1x, no AA) ================= */
function strHash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function pen(ctx,fw,fh){
  const P=(x,y,c)=>{x=Math.round(x);y=Math.round(y);
    if(x>=0&&y>=0&&x<fw&&y<fh){ctx.fillStyle=c;ctx.fillRect(x,y,1,1);}};
  const L=(x0,y0,x1,y1,c)=>{x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
    const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx-dy;
    for(;;){P(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;
      if(e2>-dy){e-=dy;x0+=sx}if(e2<dx){e+=dx;y0+=sy}}};
  const D=(cx,cy,r,c)=>{cx=Math.round(cx);cy=Math.round(cy);
    for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(r*r-y*y));
      for(let x=-w;x<=w;x++)P(cx+x,cy+y,c);}};
  const OUT=(c)=>{const img=ctx.getImageData(0,0,fw,fh),d=img.data;
    const sol=new Uint8Array(fw*fh);
    for(let i=0;i<fw*fh;i++)sol[i]=d[i*4+3]>0?1:0;
    ctx.fillStyle=c;
    for(let y=0;y<fh;y++)for(let x=0;x<fw;x++){const i=y*fw+x;
      if(sol[i])continue;
      if((x>0&&sol[i-1])||(x<fw-1&&sol[i+1])||(y>0&&sol[i-fw])||(y<fh-1&&sol[i+fw]))
        ctx.fillRect(x,y,1,1);}};
  return{P,L,D,OUT};
}
/* per-frame drawing kit (bound to pen + seeded rng) */
function kit(p,S){
  const disc=(cx,cy,r,c)=>p.D(cx,cy,r,c);
  const ring=(cx,cy,r,c,skip)=>{const n=Math.max(24,(r*8)|0);let lx=null,ly=null;
    for(let i=0;i<n;i++){if(skip&&i%skip===0)continue;const a=i/n*Math.PI*2;
      const x=Math.round(cx+Math.cos(a)*r),y=Math.round(cy+Math.sin(a)*r);
      if(x!==lx||y!==ly)p.P(x,y,c);lx=x;ly=y;}};
  const arcSeg=(cx,cy,r,a0,a1,c,th)=>{th=th||1;const n=Math.max(8,Math.round(Math.abs(a1-a0)*r));
    for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;
      for(let t=0;t<th;t++)p.P(cx+Math.cos(a)*(r+t),cy+Math.sin(a)*(r+t),c);}};
  const spike=(cx,base,h,c,tip)=>{for(let i=0;i<h;i++){const w=Math.max(0,Math.round((h-i)*0.34));
      for(let x=-w;x<=w;x++)p.P(cx+x,base-i,c);}
    if(tip&&h>0)p.P(cx,base-h,tip);};
  const spark=(x,y,cm,ch)=>{p.P(x,y,ch);p.P(x+1,y,cm);p.P(x-1,y,cm);p.P(x,y+1,cm);p.P(x,y-1,cm);};
  const streak=(cx,cy,ang,r0,r1,c)=>{p.L(cx+Math.cos(ang)*r0,cy+Math.sin(ang)*r0,
    cx+Math.cos(ang)*r1,cy+Math.sin(ang)*r1,c);};
  const fall=(n,cx,cy,spread,cols)=>{for(let k=0;k<n;k++){
    p.P(cx+(S()-0.5)*spread,cy+(S()-0.5)*spread*0.5,cols[(S()*cols.length)|0]);}};
  const dither=(cx,cy,r,c)=>{for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)
    if(dx*dx+dy*dy<=r*r&&((cx+dx+cy+dy)&1)===0)p.P(cx+dx,cy+dy,c);};
  return{disc,ring,arcSeg,spike,spark,streak,fall,dither};
}

{id:'ground_impact_01',dir:'ground',

{id:'psychic_impact_01',dir:'psychic',
 pal:{core:'#FFFFFF',hi:'#FFC8F0',mid:'#F062C8',deep:'#C22E9A',dark:'#8A1470'},outline:'#460A3A',

{id:'bug_impact_01',dir:'bug',
 pal:{hi:'#F0FF9A',mid:'#B8E23C',deep:'#78A81E',dark:'#4A6E12'},outline:'#22330A',

/* ================= RENDER + QC ================= */
function renderFrame(e,f){
  const cv=document.createElement('canvas');cv.width=96;cv.height=96;
  const ctx=cv.getContext('2d');
  const p=pen(ctx,96,96);
  const S=rng((strHash(e.id)+f*2654435761)>>>0);
  e.draw(f,p,S,kit(p,S),e.pal);
  if(e.outline)p.OUT(e.outline);
  return cv;
}
function qc(e,frames){
  const res=[],data=frames.map(cv=>cv.getContext('2d').getImageData(0,0,96,96).data);
  const hashes=data.map(d=>{let h=2166136261>>>0;
    for(let i=0;i<d.length;i+=4){if(d[i+3]){h^=(d[i]<<16|d[i+1]<<8|d[i+2])>>>0;
      h=Math.imul(h,16777619);h^=i;}}return h>>>0;});
  res.push(['8 unique frames',new Set(hashes).size===8]);
  let edge=false;frames.forEach((cv,fi)=>{const d=data[fi];
    for(let x=0;x<96&&!edge;x++){if(d[x*4+3]>0||d[95*96*4+x*4+3]>0)edge=true;}
    for(let y=0;y<96&&!edge;y++){if(d[y*96*4+3]>0||d[(y*96+95)*4+3]>0)edge=true;}});
  res.push(['no boundary clipping',!edge]);
  let lastEmpty=true;{const d=data[7];for(let i=3;i<d.length;i+=4)if(d[i]>0){lastEmpty=false;break;}}
  res.push(['clean final frame (non-loop exit)',lastEmpty]);
  return res;
}

/* ================= UI ================= */
const grid=document.getElementById('grid'),state={};
for(const e of EFFECTS){
  const frames=[];for(let f=0;f<8;f++)frames.push(renderFrame(e,f));
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<h3>${e.id} <small>${e.dir} · 96×96 · 8f · 12fps · vfx/${e.dir}/ · loop:false</small></h3>
    <div class="stages">
      <div><canvas></canvas><div class="flab">2× · checker = transparency</div></div>
      <div><canvas class="field" width="96" height="96"></canvas><div class="flab">1× · on-field readability</div></div>
    </div>
    <div class="strip"><canvas width="768" height="96"></canvas></div>
    <div class="row"><button data-a="sheet">⬇ sheet PNG</button><button data-a="frames">⬇ 8 frame PNGs</button></div>
    <div class="qc"></div><div class="note">${e.note}</div>`;
  grid.appendChild(card);
  const pv=card.querySelector('.stage canvas, canvas:not(.field)');pv.width=96;pv.height=96;
  /* field background: battle-green, subtle mottling — QC #10 readability check */
  const fcv=card.querySelector('.field'),fctx=fcv.getContext('2d');
  const FS=rng(strHash(e.id));fctx.fillStyle='#6FB44A';fctx.fillRect(0,0,96,96);
  for(let i=0;i<160;i++){fctx.fillStyle=FS()<0.5?'#79C254':'#63A63F';
    fctx.fillRect((FS()*96)|0,(FS()*96)|0,2,1);}
  const pctx=pv.getContext('2d');pctx.drawImage(frames[0],0,0);
  const sc=card.querySelector('.strip canvas'),sctx=sc.getContext('2d');
  for(let y=0;y<96;y+=8)for(let x=0;x<768;x+=8){
    sctx.fillStyle=(((x+y)/8)|0)%2?'#141c2c':'#0d1424';sctx.fillRect(x,y,8,8);}
  frames.forEach((fr,i)=>sctx.drawImage(fr,i*96,0));
  card.querySelector('.qc').innerHTML='<b>QC</b> '+qc(e,frames)
    .map(([t,ok])=>`<span class="${ok?'pass':'fail'}">${ok?'✓':'✗'} ${t}</span>`).join(' · ');
  card.querySelector('[data-a=sheet]').onclick=()=>exportSheet(e,frames);
  card.querySelector('[data-a=frames]').onclick=()=>exportFrames(e,frames);
  state[e.id]={frames,pctx,fctx,i:0,acc:0};
}
let lastT=performance.now();
(function loop(t){const dt=t-lastT;lastT=t;
  for(const e of EFFECTS){const st=state[e.id];st.acc+=dt;
    while(st.acc>=83.3){st.acc-=83.3;st.i=(st.i+1)%8;
      st.pctx.clearRect(0,0,96,96);st.pctx.drawImage(st.frames[st.i],0,0);
      st.fctx.clearRect(0,0,96,96);st.fctx.drawImage(st.frames[st.i],0,0);}}
  requestAnimationFrame(loop);})(performance.now());

/* ================= EXPORT ================= */
function dlCanvas(cv,name){cv.toBlob(b=>{const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);},'image/png');}
function exportSheet(e,frames){const cv=document.createElement('canvas');
  cv.width=768;cv.height=96;const ctx=cv.getContext('2d');
  frames.forEach((fr,i)=>ctx.drawImage(fr,i*96,0));dlCanvas(cv,e.id+'.png');}
function exportFrames(e,frames){frames.forEach((fr,i)=>
  setTimeout(()=>dlCanvas(fr,`${e.id}_f0${i}.png`),i*180));}

  global:{format:'PNG',background:'transparent',layout:'horizontal strip 8×1, no padding, no overlap',
    anchorDefault:'center = center of target hex',groundLineY:62,
    outline:'dark per-hue rim pass on all assets'},
  assets:EFFECTS.map(e=>({assetId:e.id,path:`assets/visual/vfx/${e.dir}/`,filename:e.id+'.png',
    frameSize:[96,96],frameCount:8,layout:'8 columns × 1 row',totalSize:[768,96],
    fps:12,durationMs:667,loop:false,anchor:'center',background:'transparent',
    palette:e.pal,outlineColor:e.outline,notes:e.note,
    frames:[...Array(8).keys()].map(i=>`${e.id}_f0${i}.png`)})),
  previousBatches:BATCH1_META.map(([id,dir,fs,fps])=>({assetId:id,

document.getElementById('bSheets').onclick=()=>
  EFFECTS.forEach((e,i)=>setTimeout(()=>exportSheet(e,state[e.id].frames),i*300));
document.getElementById('bFrames').onclick=()=>{let d=0;
  for(const e of EFFECTS){setTimeout(()=>exportFrames(e,state[e.id].frames),d);d+=8*180+400;}};
document.getElementById('bManifest').onclick=()=>{
  const blob=new Blob([JSON.stringify(buildManifest(),null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='combat-vfx.json';a.click();};
document.getElementById('bContact').onclick=()=>{
  const labelW=210,pad=12,rowH=96+22,H=14*rowH+44,W=labelW+768+pad*2;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');ctx.fillStyle='#101828';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffce3c';ctx.font='bold 15px monospace';
  ctx.fillText('POKÉCHESS+ — BATCH 2 ELEMENTAL IMPACTS — CONTACT SHEET (DRAFT v1)',pad,24);
  let y=40;
  for(const e of EFFECTS){ctx.fillStyle='#9db2d8';ctx.font='11px monospace';
    ctx.fillText(e.id,pad,y+38);ctx.fillText('96x96 8f 12fps',pad,y+52);
    ctx.fillText('vfx/'+e.dir+'/',pad,y+66);
    state[e.id].frames.forEach((fr,i)=>{const x=labelW+i*96;
      for(let yy=0;yy<96;yy+=8)for(let xx=0;xx<96;xx+=8){
        ctx.fillStyle=(((x+xx+yy)/8)|0)%2?'#182238':'#121a2c';ctx.fillRect(x+xx,y+yy,8,8);}
      ctx.drawImage(fr,x,y);});
    y+=rowH;}
  dlCanvas(cv,'contact_sheet_batch2.png');};
</script>
