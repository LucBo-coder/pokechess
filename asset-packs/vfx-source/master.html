<style>
  :root{--bg:#0d1830;--panel:#16264a;--panel2:#1d3260;--line:#2c4478;--gold:#ffce3c;--txt:#e9f0ff;--dim:#9db2d8;--ok:#5ad46a;--bad:#ff6a5a}

<script>
"use strict";
/* ================= TOOLCHAIN ================= */
function strHash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pen(ctx,W,H){
  const P=(x,y,c)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<W&&y<H){ctx.fillStyle=c;ctx.fillRect(x,y,1,1);}};
  const L=(x0,y0,x1,y1,c)=>{x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
    const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx-dy;
    for(;;){P(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>-dy){e-=dy;x0+=sx}if(e2<dx){e+=dx;y0+=sy}}};
  const D=(cx,cy,r,c)=>{cx=Math.round(cx);cy=Math.round(cy);
    for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(r*r-y*y));for(let x=-w;x<=w;x++)P(cx+x,cy+y,c);}};
  const DOME=(cx,cy,r,c)=>{for(let y=-r;y<=0;y++){const w=Math.round(Math.sqrt(r*r-y*y));
    for(let x=-w;x<=w;x++)P(cx+x,cy+y,c);}};
  const OUT=(c)=>{const img=ctx.getImageData(0,0,W,H),d=img.data;const sol=new Uint8Array(W*H);
    for(let i=0;i<W*H;i++)sol[i]=d[i*4+3]>0?1:0;ctx.fillStyle=c;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;if(sol[i])continue;
      if((x>0&&sol[i-1])||(x<W-1&&sol[i+1])||(y>0&&sol[i-W])||(y<H-1&&sol[i+W]))ctx.fillRect(x,y,1,1);}};
  return{P,L,D,DOME,OUT};
}
function kit(p,S){
  const disc=(cx,cy,r,c)=>p.D(cx,cy,r,c);
  const ring=(cx,cy,r,c,skip)=>{const n=Math.max(24,(r*8)|0);let lx=null,ly=null;
    for(let i=0;i<n;i++){if(skip&&i%skip===0)continue;const a=i/n*Math.PI*2;
      const x=Math.round(cx+Math.cos(a)*r),y=Math.round(cy+Math.sin(a)*r);
      if(x!==lx||y!==ly)p.P(x,y,c);lx=x;ly=y;}};
  const ell=(cx,cy,rx,ry,c,skip)=>{const n=Math.max(24,((rx+ry)*4)|0);let lx=null,ly=null;
    for(let i=0;i<n;i++){if(skip&&i%skip===0)continue;const a=i/n*Math.PI*2;
      const x=Math.round(cx+Math.cos(a)*rx),y=Math.round(cy+Math.sin(a)*ry);
      if(x!==lx||y!==ly)p.P(x,y,c);lx=x;ly=y;}};
  const dashEll=(cx,cy,rx,ry,c,seg,off)=>{const n=Math.max(36,((rx+ry)*5)|0);
    for(let i=0;i<n;i++){if(((i+off)%seg)>=seg*0.55)continue;const a=i/n*Math.PI*2;
      p.P(cx+Math.cos(a)*rx,cy+Math.sin(a)*ry,c);}};
  const arcSeg=(cx,cy,r,a0,a1,c,th)=>{th=th||1;const n=Math.max(8,Math.round(Math.abs(a1-a0)*r));
    for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;
      for(let t=0;t<th;t++)p.P(cx+Math.cos(a)*(r+t),cy+Math.sin(a)*(r+t),c);}};
  const spike=(cx,base,h,c,tip)=>{for(let i=0;i<h;i++){const w=Math.max(0,Math.round((h-i)*0.34));
      for(let x=-w;x<=w;x++)p.P(cx+x,base-i,c);}if(tip&&h>0)p.P(cx,base-h,tip);};
  const spark=(x,y,cm,ch)=>{p.P(x,y,ch);p.P(x+1,y,cm);p.P(x-1,y,cm);p.P(x,y+1,cm);p.P(x,y-1,cm);};
  const streak=(cx,cy,ang,r0,r1,c)=>{p.L(cx+Math.cos(ang)*r0,cy+Math.sin(ang)*r0,
    cx+Math.cos(ang)*r1,cy+Math.sin(ang)*r1,c);};
  const fall=(n,cx,cy,spread,cols)=>{for(let k=0;k<n;k++)
    p.P(cx+(S()-0.5)*spread,cy+(S()-0.5)*spread*0.5,cols[(S()*cols.length)|0]);};
  const dither=(cx,cy,r,c)=>{for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)
    if(dx*dx+dy*dy<=r*r&&((cx+dx+cy+dy)&1)===0)p.P(cx+dx,cy+dy,c);};
  const flake=(x,y,c1,c2)=>{p.P(x,y,c1);p.P(x-1,y,c2);p.P(x+1,y,c2);p.P(x,y-1,c2);p.P(x,y+1,c2);
    p.P(x-2,y-2,c2);p.P(x+2,y-2,c2);p.P(x-2,y+2,c2);p.P(x+2,y+2,c2);};
  const zglyph=(x,y,c)=>{for(let i=0;i<5;i++){p.P(x+i,y,c);p.P(x+i,y+4,c);}
    p.P(x+3,y+1,c);p.P(x+2,y+2,c);p.P(x+1,y+3,c);};
  const leaf=(x,y,o,C)=>{const m=C.mid,d=C.deep,h=C.hi||C.mid,k=C.dark||C.deep;
    const put=(dx,dy,c)=>p.P(x+dx,y+dy,c);
    if(o===0){put(0,-1,h);put(1,0,m);put(0,0,m);put(-1,0,m);put(0,1,d);put(0,2,k);}
    else if(o===1){put(1,0,h);put(0,-1,m);put(0,0,m);put(0,1,m);put(-1,0,d);put(-2,0,k);}
    else if(o===2){put(0,1,h);put(-1,0,m);put(0,0,m);put(1,0,m);put(0,-1,d);put(0,-2,k);}
    else{put(-1,0,h);put(0,1,m);put(0,0,m);put(0,-1,m);put(1,0,d);put(2,0,k);}};
  const star8=(cx,cy,rH,rV,rD,c)=>{for(let i=1;i<=rH;i++){p.P(cx+i,cy,c);p.P(cx-i,cy,c);}
    for(let i=1;i<=rV;i++){p.P(cx,cy+i,c);p.P(cx,cy-i,c);}
    for(let i=1;i<=rD;i++){p.P(cx+i,cy+i,c);p.P(cx-i,cy-i,c);p.P(cx+i,cy-i,c);p.P(cx-i,cy+i,c);}};
  return{disc,ring,ell,dashEll,arcSeg,spike,spark,streak,fall,dither,flake,zglyph,leaf,star8};
}
function kernelDot(p,K,S,C,k,x,y){switch(k){
  case 'flame':p.P(x,y,C.mid);p.P(x,y-1,C.hi);break;
  case 'bolt':p.L(x-1,y,x+1,y-2,C.mid);p.P(x+1,y-2,C.hi);break;
  case 'leaf':p.P(x,y,C.mid);p.P(x+1,y,C.deep);break;
  case 'crystal':p.P(x,y,C.hi);p.P(x-1,y+1,C.mid);p.P(x+1,y+1,C.mid);break;
  case 'bubble':p.P(x,y,C.hi);p.P(x+1,y,C.mid);p.P(x-1,y,C.mid);p.P(x,y+1,C.mid);break;
  case 'rock':p.P(x,y,C.deep);p.P(x+1,y,C.mid);p.P(x,y+1,C.dark||C.deep);break;
  case 'swirl':p.P(x,y,C.mid);p.P(x-1,y+1,C.hi||C.mid);break;
  case 'swarm':p.P(x+((S()*3)|0)-1,y+((S()*3)|0)-1,C.mid);break;
  case 'star':p.P(x,y,C.core||C.hi);p.P(x-1,y,C.mid);p.P(x+1,y,C.mid);p.P(x,y-1,C.mid);p.P(x,y+1,C.mid);break;
  default:p.P(x,y,C.hi||C.mid);p.P(x+1,y,C.mid);}}
function castFlair(p,K,S,C,k,cx,cy,f,tt){switch(k){
  case 'flame':{const h=6+Math.round(Math.sin(tt*6.283)*3);
    for(let i=0;i<h;i++)p.P(cx+Math.round(Math.sin(i*0.8+tt*6.283)),cy-5-i,i>h-3?C.hi:C.mid);break;}
  case 'bolt':K.streak(cx,cy,-2.2,9,16,C.mid);K.streak(cx,cy,0.9,9,16,C.mid);break;
  case 'leaf':K.leaf(cx-10,cy-6,f%4,C);K.leaf(cx+10,cy+5,(f+2)%4,C);break;
  case 'crystal':for(const[a,r]of[[-2.2,11],[0.5,12],[2.4,11]]){const x=Math.round(cx+Math.cos(a)*r),y=Math.round(cy+Math.sin(a)*r);
    p.P(x,y,C.hi);p.P(x,y+1,C.mid);p.P(x,y+2,C.deep);}break;
  case 'bubble':for(let q=0;q<3;q++){const bx=cx-6+q*6,by=cy+9-((f*2+q*4)%18);p.P(bx,by,C.hi);p.P(bx+1,by,C.mid);}break;
  case 'rock':K.dither(cx,cy+13,4,C.dark||C.deep);break;
  case 'ring':if(f%2===0)K.ring(cx,cy,12+((f/2)|0)*2,C.deep,4);break;
  case 'star':if(f%2===0)K.spark(cx-9,cy-9,C.mid,C.core||C.hi);else K.spark(cx+9,cy+7,C.mid,C.core||C.hi);break;
  case 'swarm':for(let q=0;q<3;q++)p.P(cx+(S()-0.5)*26,cy-9+(S()-0.5)*10,C.hi);break;}}

/* ================= TYPE TABLE ================= */
const T={
 fire:{pal:{core:'#FFF3B0',hi:'#FFC93C',mid:'#FF8A2A',deep:'#F2542D',dark:'#C22E12'},out:'#7A1E0A',k:'flame',proj:'orb',trail:'flame'},
 water:{pal:{core:'#FFFFFF',hi:'#BFEFFF',mid:'#58B7F0',deep:'#2C7BD4',dark:'#1A4E9E'},out:'#12386E',k:'orb',proj:'orb',trail:'drop'},
 electric:{pal:{core:'#FFFFFF',hi:'#FFF9C0',mid:'#FFE23C',deep:'#FFC400',dark:'#B8860B'},out:'#4A3800',k:'bolt',proj:'shard',trail:'spark'},
 grass:{pal:{core:'#F0FFC8',hi:'#E8F8B0',mid:'#A8E05A',deep:'#58B43C',dark:'#2E7A24',vine:'#7BC94A'},out:'#1E4A16',k:'leaf',proj:'leaf',trail:'petal'},
 ice:{pal:{core:'#FFFFFF',hi:'#D8F6FF',mid:'#8ADCF8',deep:'#48B0E8',dark:'#2A78B8'},out:'#103C60',k:'crystal',proj:'shard',trail:'glint'},
 normal:{pal:{core:'#FFFFFF',hi:'#E8ECF2',mid:'#B8C4D4',deep:'#8494AC'},out:'#333F52',k:'orb',proj:'orb',trail:'streak'},
 fighting:{pal:{core:'#FFFFFF',hi:'#FFE9C8',mid:'#FFB25A',deep:'#E07B2A',dark:'#B85A1A'},out:'#6E3A12',k:'orb',proj:'wave',trail:'streak'},
 poison:{pal:{hi:'#E2B6FF',mid:'#B565D8',deep:'#7E2FA8',dark:'#4E1668'},out:'#2E0C40',k:'bubble',proj:'blob',trail:'wisp'},
 ground:{pal:{hi:'#E8C98F',mid:'#C99B5A',deep:'#9A6B38',dark:'#6B4526'},out:'#3A2410',k:'rock',proj:'rock',trail:'dust'},
 flying:{pal:{core:'#FFFFFF',hi:'#DFF6FF',mid:'#A8D8F0',deep:'#6FA8D0'},out:'#23486A',k:'swirl',proj:'crescent',trail:'streak'},
 psychic:{pal:{core:'#FFFFFF',hi:'#FFC8F0',mid:'#F062C8',deep:'#C22E9A',dark:'#8A1470'},out:'#460A3A',k:'ring',proj:'orb',trail:'glint'},
 bug:{pal:{hi:'#F0FF9A',mid:'#B8E23C',deep:'#78A81E',dark:'#4A6E12'},out:'#22330A',k:'swarm',proj:'shard',trail:'buzz'},
 rock:{pal:{hi:'#D8D0C0',mid:'#A89880',deep:'#786858',dark:'#50443A'},out:'#262018',k:'rock',proj:'rock',trail:'dust'},
 ghost:{pal:{core:'#E8F8FF',hi:'#B8D8F8',mid:'#8868D8',deep:'#5A34A8',dark:'#381E70'},out:'#180C40',k:'flame',proj:'blob',trail:'wisp'},
 dragon:{pal:{core:'#FFFFFF',hi:'#C8B8FF',mid:'#8858F0',deep:'#5830C8',dark:'#3A1E90',azure:'#48A8F8'},out:'#1E0E50',k:'swirl',proj:'orb',trail:'flame'},
 dark:{pal:{core:'#E8D8FF',hi:'#A868E8',mid:'#6A2AB8',deep:'#381060',dark:'#1A0828'},out:'#0A0414',k:'swirl',proj:'crescent',trail:'wisp'},
 steel:{pal:{core:'#FFFFFF',hi:'#E8F0F8',mid:'#B8C8D8',deep:'#8898AC'},out:'#333F52',k:'crystal',proj:'shard',trail:'spark'},
 fairy:{pal:{core:'#FFFFFF',hi:'#FFD8F0',mid:'#FF9AC8',deep:'#F05AA8',dark:'#C82880'},out:'#6E1046',k:'star',proj:'star',trail:'glint'}
};
const TYPES=Object.keys(T);

/* ================= B3a — CASTS (18) ================= */
const CASTS=TYPES.map(tn=>{const t=T[tn];return{
 id:'cast_'+tn+'_01',dir:tn,W:64,H:64,n:8,fps:12,loop:true,pal:t.pal,out:t.out,
 note:tn+' cast/charge, looping while charging. Kernel "'+t.k+'" + per-type flair.',
 draw(f,p,S,K,C){const cx=32,cy=32,tt=f/8,ph=Math.sin(tt*6.283);
   const R=3+Math.round((ph+1)*1.5);
   p.D(cx,cy,R+2,C.deep);p.D(cx,cy,R,C.mid);p.D(cx,cy,Math.max(1,R-2),C.core||C.hi);
   for(let k=0;k<10;k++){const a=k*0.628+tt*9.425,u=(tt+k*0.125)%1,r=Math.round(4+(1-u)*22);
     kernelDot(p,K,S,C,t.k,Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r*0.9));}
   if(f%2===0)K.ring(cx,cy,R+4,C.hi||C.mid,3);
   castFlair(p,K,S,C,t.k,cx,cy,f,tt);}};});

/* ================= B3b — PROJECTILES (18) ================= */
function projHead(p,K,C,kind,x,y){switch(kind){
 case 'orb':p.D(x,y,5,C.deep);p.D(x,y,3,C.mid);p.P(x,y,C.core||C.hi);break;
 case 'shard':for(let i=-3;i<=3;i++){const w=3-Math.abs(i);for(let j=-w;j<=w;j++)p.P(x+j,y+i,C.mid);}
   for(let i=-1;i<=1;i++)p.P(x+i,y,C.core||C.hi);p.P(x+3,y,C.hi);p.P(x-3,y,C.deep);p.P(x-4,y,C.dark||C.deep);break;
 case 'leaf':K.leaf(x,y,1,C);K.leaf(x-4,y-2,0,C);break;
 case 'crescent':K.arcSeg(x,y,5,-0.9,0.9,C.hi,2);K.arcSeg(x,y,7,-0.8,0.8,C.mid,1);break;
 case 'rock':p.P(x,y,C.mid);p.P(x+1,y,C.mid);p.P(x-1,y,C.deep);p.P(x,y+1,C.deep);p.P(x+1,y+1,C.deep);
   p.P(x-1,y-1,C.hi);p.P(x,y-1,C.mid);p.P(x+2,y,C.deep);p.P(x-2,y,C.dark||C.deep);break;
 case 'star':K.spark(x,y,C.mid,C.core||C.hi);p.P(x-2,y,C.hi);p.P(x+2,y,C.hi);p.P(x,y-2,C.hi);p.P(x,y+2,C.hi);break;
 case 'blob':K.dither(x,y,5,C.deep);K.dither(x,y,3,C.mid);p.P(x,y,C.hi||C.mid);break;
 case 'wave':K.arcSeg(x,y,4,-1.2,1.2,C.hi,2);K.arcSeg(x,y,6,-1.1,1.1,C.mid,1);break;}}
function projTrail(p,K,S,C,kind,hx,hy,f){switch(kind){
 case 'flame':for(let i=1;i<=6;i++){const x=hx-6*i-2,h=1+((i+f)%3);
   p.P(x,hy,C.mid);for(let q=1;q<=h;q++)p.P(x,hy-q,i===1?C.hi:C.mid);p.P(x,hy+1,C.deep);}break;
 case 'drop':for(let i=1;i<=6;i++){const x=hx-7*i-2,y=hy+((i*2+f)%5)-2;
   p.P(x,y,C.mid);p.P(x,y+1,C.deep);p.P(x-1,y,C.hi);}break;
 case 'spark':for(let i=1;i<=7;i++){const x=hx-6*i-2,s=(i+f)%2?3:-3;
   p.P(x,hy,C.mid);p.P(x,hy+s,C.hi);p.P(x,hy+s+((i%2)?1:-1),C.mid);}break;
 case 'petal':for(let i=1;i<=5;i++){const x=hx-8*i,y=hy+((i+f)%2?4:-4);
   p.P(x,y,C.mid);p.P(x+1,y,C.deep);p.P(x,y+1,C.hi||C.mid);}break;
 case 'glint':for(let i=1;i<=5;i++){const x=hx-9*i-3;if((i+f)%2===0){p.P(x,hy,C.hi);
   p.P(x-1,hy,C.mid);p.P(x+1,hy,C.mid);p.P(x,hy-1,C.mid);p.P(x,hy+1,C.mid);}}break;
 case 'streak':for(let i=1;i<=7;i++){const x=hx-5*i-2;p.L(x,hy,x+3,hy,i<3?C.hi:C.mid);}break;
 case 'buzz':for(let i=1;i<=8;i++){const x=hx-5*i-2+((S()*3)|0)-1,y=hy+((S()*5)|0)-2;
   p.P(x,y,i<3?C.hi:C.mid);}break;
 case 'wisp':for(let i=1;i<=4;i++){const x=hx-9*i-3;K.dither(x,hy-((i+f)%3),Math.max(1,3-((i/2)|0)),i<2?C.mid:C.deep);}break;
 case 'dust':for(let i=1;i<=6;i++){const x=hx-6*i-2,y=hy+Math.min(8,i*2-((7-f)%3));
   K.dither(x,y,i<3?2:3,i<3?C.mid:C.deep);}break;}}
const PROJS=TYPES.map(tn=>{const t=T[tn];return{

/* ================= ASSEMBLE + RENDER + QC ================= */
const ALL=[].concat(CASTS,PROJS,AOES,SKILLS,STATUS,BOSS);
function renderFrame(a,f){const cv=document.createElement('canvas');cv.width=a.W;cv.height=a.H;
  const ctx=cv.getContext('2d'),p=pen(ctx,a.W,a.H),S=rng((strHash(a.id)+f*2654435761)>>>0);
  a.draw(f,p,S,kit(p,S),a.pal);if(a.out)p.OUT(a.out);return cv;}
function qc(a,frames){const res=[];
  const data=frames.map(cv=>cv.getContext('2d').getImageData(0,0,a.W,a.H).data);
  const hashes=data.map(d=>{let h=2166136261>>>0;
    for(let i=0;i<d.length;i+=4){if(d[i+3]){h^=(d[i]<<16|d[i+1]<<8|d[i+2])>>>0;h=Math.imul(h,16777619);h^=i;}}return h>>>0;});
  res.push([a.n+' unique frames',new Set(hashes).size===a.n]);
  let edge=false;frames.forEach((cv,fi)=>{const d=data[fi];
    for(let x=0;x<a.W&&!edge;x++){if(d[x*4+3]>0||d[((a.H-1)*a.W+x)*4+3]>0)edge=true;}
    for(let y=0;y<a.H&&!edge;y++){if(d[y*a.W*4+3]>0||d[(y*a.W+a.W-1)*4+3]>0)edge=true;}});
  res.push(['no boundary clipping',!edge]);
  if(a.ends){let lastEmpty=true;const d=data[a.n-1];
    for(let i=3;i<d.length;i+=4)if(d[i]>0){lastEmpty=false;break;}
    res.push(['clean final frame (non-loop exit)',lastEmpty]);}
  else res.push(['loop exit OK (loop:'+a.loop+')',true]);
  return res;}

/* ================= UI ================= */
const PACKS={casts:CASTS,projectiles:PROJS,aoe:AOES,skills:SKILLS,status:STATUS,boss:BOSS};
const grid=document.getElementById('grid'),tabsEl=document.getElementById('tabs'),state={};
let curPack='casts';
for(const name of Object.keys(PACKS)){const b=document.createElement('button');
  b.textContent=name.toUpperCase()+' ('+PACKS[name].length+')';
  b.onclick=()=>{curPack=name;document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');renderPack(name);};tabsEl.appendChild(b);}
function fieldBG(ctx,w,h,seed){const FS=rng(strHash(seed));ctx.fillStyle='#6FB44A';ctx.fillRect(0,0,w,h);
  for(let i=0;i<w*h/55;i++){ctx.fillStyle=FS()<0.5?'#79C254':'#63A63F';
    ctx.fillRect((FS()*w)|0,(FS()*h)|0,2,1);}}
function renderPack(name){grid.innerHTML='';state[name]={};
  for(const a of PACKS[name]){
    const frames=[];for(let f=0;f<a.n;f++)frames.push(renderFrame(a,f));
    const card=document.createElement('div');card.className='card';
    const sc=a.W<=64?2:1;
    card.innerHTML='<h3>'+a.id+'<small>'+a.dir+' · '+a.W+'×'+a.H+' · '+a.n+'f · '+a.fps+'fps · loop:'+a.loop+' · vfx/'+a.dir+'/</small></h3>'
      +'<div class="stages"><div><canvas style="width:'+(a.W*sc)+'px;height:'+(a.H*sc)+'px"></canvas>'
      +'<div class="flab">'+sc+'× · checker = transparency</div></div>'
      +'<div><canvas class="field" width="'+a.W+'" height="'+a.H+'" style="width:'+(a.W*sc)+'px;height:'+(a.H*sc)+'px"></canvas>'
      +'<div class="flab">on-field readability</div></div></div>'
      +'<div class="strip"><canvas width="'+(a.n*a.W)+'" height="'+a.H+'"></canvas></div>'
      +'<div class="row"><button data-a="sheet">⬇ sheet PNG</button><button data-a="frames">⬇ frame PNGs</button></div>'
      +'<div class="qc"></div><div class="note">'+a.note+'</div>';
    grid.appendChild(card);
    const pv=card.querySelector('.stages canvas');pv.width=a.W;pv.height=a.H;
    const pctx=pv.getContext('2d');pctx.drawImage(frames[0],0,0);
    const fcv=card.querySelector('.field'),fctx=fcv.getContext('2d');fieldBG(fctx,a.W,a.H,a.id);
    const scv=card.querySelector('.strip canvas'),sctx=scv.getContext('2d');
    for(let y=0;y<a.H;y+=8)for(let x=0;x<a.n*a.W;x+=8){
      sctx.fillStyle=(((x+y)/8)|0)%2?'#141c2c':'#0d1424';sctx.fillRect(x,y,8,8);}
    frames.forEach((fr,i)=>sctx.drawImage(fr,i*a.W,0));
    card.querySelector('.qc').innerHTML='<b>QC</b> '+qc(a,frames)
      .map(t=>'<span class="'+(t[1]?'pass':'fail')+'">'+(t[1]?'✓':'✗')+' '+t[0]+'</span>').join(' · ');
    card.querySelector('[data-a=sheet]').onclick=()=>exportSheet(a,frames);
    card.querySelector('[data-a=frames]').onclick=()=>exportFrames(a,frames);
    state[name][a.id]={frames,pctx,fctx,i:0,acc:0};}}
tabsEl.firstChild.classList.add('on');renderPack('casts');
let lastT=performance.now();
(function loop(t){const dt=t-lastT;lastT=t;
  for(const a of PACKS[curPack]){const st=state[curPack][a.id];if(!st)continue;
    st.acc+=dt;const step=1000/a.fps;
    while(st.acc>=step){st.acc-=step;st.i=(st.i+1)%a.n;
      st.pctx.clearRect(0,0,a.W,a.H);st.pctx.drawImage(st.frames[st.i],0,0);
      st.fctx.clearRect(0,0,a.W,a.H);fieldBG(st.fctx,a.W,a.H,a.id);
      st.fctx.drawImage(st.frames[st.i],0,0);}}
  requestAnimationFrame(loop);})(performance.now());

/* ================= EXPORT ================= */
function dl(cv,name){cv.toBlob(b=>{const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);},'image/png');}
function exportSheet(a,frames){const cv=document.createElement('canvas');
  cv.width=a.n*a.W;cv.height=a.H;const ctx=cv.getContext('2d');
  frames.forEach((fr,i)=>ctx.drawImage(fr,i*a.W,0));dl(cv,a.id+'.png');}
function exportFrames(a,frames){frames.forEach((fr,i)=>
  setTimeout(()=>dl(fr,a.id+'_f'+String(i).padStart(2,'0')+'.png'),i*150));}
const B12=[['hit_light_01','basic',64,14],['hit_heavy_01','basic',96,12],['slash_claw_01','basic',96,12],
 ['crit_hit_01','basic',128,12],['fire_impact_01','fire',96,12],['electric_impact_01','electric',96,12],
 ['water_splash_01','water',96,12],['grass_vine_01','grass',96,12],
 ['normal_impact_01','normal',96,12],['fighting_impact_01','fighting',96,12],['poison_impact_01','poison',96,12],
 ['ground_impact_01','ground',96,12],['flying_impact_01','flying',96,12],['psychic_impact_01','psychic',96,12],
 ['bug_impact_01','bug',96,12],['rock_impact_01','rock',96,12],['ghost_impact_01','ghost',96,12],
 ['dragon_impact_01','dragon',96,12],['dark_impact_01','dark',96,12],['steel_impact_01','steel',96,12],
 ['fairy_impact_01','fairy',96,12],['ice_impact_01','ice',96,12]];
function entry(a){return{assetId:a.id,path:'assets/visual/vfx/'+a.dir+'/',filename:a.id+'.png',
  frameSize:[a.W,a.H],frameCount:a.n,layout:a.n+' columns × 1 row',
  totalSize:[a.n*a.W,a.H],fps:a.fps,durationMs:Math.round(a.n*1000/a.fps),
  loop:a.loop,anchor:'center',background:'transparent',palette:a.pal,outlineColor:a.out||null,
  notes:a.note,frames:[...Array(a.n).keys()].map(i=>a.id+'_f'+String(i).padStart(2,'0')+'.png')};}
function manifest(){return{
  game:'PokéChess+',asset:'combat-vfx',version:'1.0.0-draft.3',
  status:'DRAFT — pending art-direction approval. Geometry/transparency/alignment machine-verified per frame.',
  packD:'Pokémon character frames (assets/visual/animations/pokemon/) intentionally EMPTY — no reference sprite supplied; game uses existing sprites + procedural movement per spec. Awaiting reference + approval.',
  global:{format:'PNG',background:'transparent',layout:'horizontal strip, uniform frames, no padding/overlap',
    anchorDefault:'center = center of target hex',groundLineY:96,groundLineY128:84,
    outline:'dark per-hue rim pass on all assets',
    display:'effects drawn at 1× native pixels; preview scaled nearest-neighbor only'},
  packs:{
   batch1_2_impacts:B12.map(m=>({assetId:m[0],path:'assets/visual/vfx/'+m[1]+'/',filename:m[0]+'.png',
     frameSize:[m[2],m[2]],frameCount:8,fps:m[3],loop:false,source:'Batch 1–2 tools'})),
   batch3_casts:CASTS.map(entry),batch3_projectiles:PROJS.map(entry),
   batch4_aoe:AOES.map(entry),packC_signature:SKILLS.map(entry),
   packE_status:STATUS.map(entry),packF_boss:BOSS.map(entry)}};}
document.getElementById('bSheets').onclick=()=>{
  ALL.forEach((a,i)=>setTimeout(()=>exportSheet(a,state[curPack][a.id]?state[curPack][a.id].frames:
    [...Array(a.n).keys()].map(f=>renderFrame(a,f))),i*250));};
document.getElementById('bFrames').onclick=()=>{let d=0;
  for(const a of ALL){setTimeout(()=>exportFrames(a,[...Array(a.n).keys()].map(f=>renderFrame(a,f))),d);
    d+=a.n*150+300;}};
document.getElementById('bManifest').onclick=()=>{
  const blob=new Blob([JSON.stringify(manifest(),null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='combat-vfx.json';a.click();};
document.getElementById('bContact').onclick=()=>{
  const list=PACKS[curPack],labelW=210,pad=12,maxW=Math.max(...list.map(a=>a.n*a.W));
  const H=list.reduce((s,a)=>s+a.H+22,0)+44,W=labelW+maxW+pad*2;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
  ctx.fillStyle='#101828';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffce3c';ctx.font='bold 15px monospace';
  ctx.fillText('POKÉCHESS+ — '+curPack.toUpperCase()+' — CONTACT SHEET (DRAFT v1)',pad,24);
  let y=40;
  for(const a of list){ctx.fillStyle='#9db2d8';ctx.font='11px monospace';
    ctx.fillText(a.id,pad,y+a.H/2-10);
    ctx.fillText(a.W+'x'+a.H+' '+a.n+'f '+a.fps+'fps loop:'+a.loop,pad,y+a.H/2+4);
    ctx.fillText('vfx/'+a.dir+'/',pad,y+a.H/2+18);
    [...Array(a.n).keys()].map(f=>renderFrame(a,f)).forEach((fr,i)=>{const x=labelW+i*a.W;
      for(let yy=0;yy<a.H;yy+=8)for(let xx=0;xx<a.W;xx+=8){
        ctx.fillStyle=(((x+xx+yy)/8)|0)%2?'#182238':'#121a2c';ctx.fillRect(x+xx,y+yy,8,8);}
      ctx.drawImage(fr,x,y);});
    y+=a.H+22;}
  dl(cv,'contact_sheet_'+curPack+'.png');};
